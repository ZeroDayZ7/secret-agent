[package]
name = "secret-agent"
version = "0.1.0"
edition = "2024"
description = "Lekki sidecar UDS do dystrybucji sekretów pobranych z serwera KMS wewnątrz poda K8s."
license = "Proprietary"

[[bin]]
name = "secret-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "signal", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
libc = "0.2"
hex = "0.4.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
