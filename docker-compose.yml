services:
  secret-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secret-agent
    networks:
      - sec-net
    environment:
      - SECRET_AGENT_KMS_URL=http://kms-service:8080
      - SECRET_AGENT_KMS_SECRETS_PATH=/api/v1/agent/credentials/issue
      - SECRET_AGENT_CLIENT_ID=auth-service
      - SECRET_AGENT_HMAC_KEY=super-long-random-secret-for-auth-service-hmac-64-bytes
      - SECRET_AGENT_SOCKET_PATH=/var/run/agent-sockets/agent.sock
      - RUST_LOG=info

      # Opcjonalne nadpisanie czasów (w sekundach):
      - SECRET_AGENT_KMS_TIMEOUT_SECS=10            # Timeout zapytań HTTP do KMS (sekundy)
      - SECRET_AGENT_SOCKET_MODE=0o660              # Uprawnienia pliku socketu UDS
      - SECRET_AGENT_DEFAULT_TTL_SECS=2700          # 45 minut
      - SECRET_AGENT_RENEWAL_LOOKAHEAD_SECS=900     # 15 minut przed wygaśnięciem
      - SECRET_AGENT_POLL_INTERVAL_SECS=15
    volumes:
      - socket-data:/var/run/agent-sockets

volumes:
  socket-data:
    name: secret_agent_sockets

networks:
  sec-net:
    name: kms_sec-net
    external: true
